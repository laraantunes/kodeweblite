version: '3.8'

services:
  kodeweb_lite:
    build: .
    container_name: kodeweb_lite_app
    ports:
      # Usando a porta 8081 para não conflitar com a 8080 do KodeWeb
      - "8081:80"
    volumes:
      - ./data:/var/www/html/data
      - ./connections:/var/www/html/connections
      # Mapear a raiz D:\ do seu computador para o KodeWeb Lite acessar como Workspace:
      - D:\:/workspace
    restart: unless-stopped
